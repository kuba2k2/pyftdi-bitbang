[tool.poetry]
name = "pyftdi-bitbang"
version = "1.0.0"
description = "Bit-bang protocol support for PyFtdi"
authors = ["Kuba Szczodrzyński <kuba@szczodrzynski.pl>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "pyftdibb" },
]

[tool.poetry.dependencies]
python = "^3.8"
pyftdi = "^0.55.0"
pyspiflash = "^0.6.3"
pyi2cflash = "^0.2.2"

[tool.poetry.group.dev.dependencies]
black = {version = "^26.10.1", markers = "python_version >= '3.10'"}
isort = {version = "^9.0.2", markers = "python_version >= '3.10'"}
autoflake = {version = "^2.4.0", markers = "python_version >= '3.10'"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
